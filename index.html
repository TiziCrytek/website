<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MARATHON // U-ESC</title>
    <style>
        :root {
            --bg: #050505;
            --accent: #F3F100; /* Тот самый желтый */
            --text: #ffffff;
            --glitch-pink: #ff00ff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Эффект старого монитора / сетки */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        header {
            padding: 40px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--accent);
            text-shadow: 3px 3px var(--glitch-pink);
        }

        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-left: 20px solid var(--accent);
            margin-top: 20px;
        }

        h1 {
            font-size: 8rem;
            line-height: 0.8;
            margin: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 50px;
        }

        .stat-box {
            border: 1px solid #333;
            padding: 20px;
            font-family: monospace;
            transition: all 0.3s;
        }

        .stat-box:hover {
            background: var(--accent);
            color: black;
        }

        .stat-label { color: #666; font-size: 0.8rem; }
        .stat-box:hover .stat-label { color: #000; }

        .btn-run {
            background: var(--accent);
            color: black;
            padding: 20px 40px;
            font-weight: bold;
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">M-ATHON</div>
    <nav>DATA // SYNC // VOID</nav>
</header>

<section class="hero">
    <div class="stat-label">STATUS: EXTRACTION PENDING</div>
    <h1>RUNNER<br>0412</h1>
    <p>МЫ ОБНАРУЖИЛИ АНОМАЛИЮ В СЕКТОРЕ 7. ПРИГОТОВИТЬСЯ К ВЫСАДКЕ.</p>
    
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">OXYGEN</div>
            <div>[||||||||--] 82%</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">THREAT LEVEL</div>
            <div>CRITICAL</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">LOCATION</div>
            <div>TAU CETI E</div>
        </div>
    </div>

    <a href="#" class="btn-run">НАЧАТЬ ВЫСАДКУ</a>
</section>

</body>
</html>
